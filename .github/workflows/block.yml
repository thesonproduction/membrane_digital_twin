name: Lock Main Branch

on:
  push:
    branches:
      - main

jobs:
  block-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check if merge or direct push
        run: |
          # Nếu không phải là một hành động gộp từ Pull Request, chặn ngay lập tức
          echo "Hệ thống phát hiện hành vi push thẳng lên main!"
          echo "Vui lòng mở Pull Request để duyệt code."
          exit 1